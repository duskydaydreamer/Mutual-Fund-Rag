name: Daily Data Ingestion

on:
  schedule:
    # Runs at 05:00 UTC = 10:30 AM IST (UTC+5:30)
    - cron: "0 5 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  ingest:
    name: Scrape, Embed & Update Vector Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/run_ingestion.py

      - name: Commit updated vectorstore
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vectorstore/
          git diff --staged --quiet || git commit -m "chore: daily vectorstore refresh $(date -u +%Y-%m-%d)"
          git push
