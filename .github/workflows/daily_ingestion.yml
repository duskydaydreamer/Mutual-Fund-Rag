name: Daily Data Ingestion

on:
  schedule:
    # Runs at 05:00 UTC = 10:30 AM IST (UTC+5:30)
    - cron: "0 5 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  ingest:
    name: Scrape, Embed & Update Vector Store
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data refresh pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: python scripts/run_data_refresh.py

      - name: Commit updated source data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data refresh"
          file_pattern: "data/raw/* data/processed/*"

